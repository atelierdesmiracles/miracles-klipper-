name: Android CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test Android app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21d
          add-to-path: false

      - name: Show toolchain versions
        working-directory: ./app
        run: |
          java -version
          ./gradlew --version

      - name: Run unit tests
        working-directory: ./app
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: ./app
        run: ./gradlew --no-daemon assembleDebug

      - name: Build release APK
        working-directory: ./app
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APKs and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miracle-klipper-ci-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            app/app/build/outputs/apk/**/*.apk
            app/app/build/reports/tests/**
            app/app/build/test-results/**

  release:
    name: Publish unsigned test APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download CI artifacts
        uses: actions/download-artifact@v4
        with:
          name: miracle-klipper-ci-${{ github.run_number }}
          path: release-artifacts

      - name: Prepare release asset
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find release-artifacts -type f -name '*release*.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo "Release APK not found in CI artifacts" >&2
            find release-artifacts -maxdepth 6 -type f -print
            exit 1
          fi
          cp "$apk" "Miracle-Klipper-${GITHUB_REF_NAME}-unsigned.apk"
          sha256sum "Miracle-Klipper-${GITHUB_REF_NAME}-unsigned.apk" > "Miracle-Klipper-${GITHUB_REF_NAME}-SHA256SUMS.txt"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Miracle-Klipper-${{ github.ref_name }}-unsigned.apk
            Miracle-Klipper-${{ github.ref_name }}-SHA256SUMS.txt
