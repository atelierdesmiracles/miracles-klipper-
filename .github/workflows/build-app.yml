name: Android CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test Android app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Current Android SDK command-line tools require JDK 17.
      - name: Set up JDK 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub-hosted Ubuntu runners already provide Android SDK command-line tools.
      # Avoid android-actions/setup-android here: its default "tools" package is obsolete.
      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK sdkmanager was not found under $SDK_ROOT" >&2
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDKMANAGER"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-28" "build-tools;30.0.3" "cmake;3.22.1"

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21d
          add-to-path: false

      # Legacy project: Gradle 7.2 / Android Gradle Plugin 7.1.3.
      - name: Set up JDK 11 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: gradle

      # The repository's gradlew may not have its executable bit set.
      # Invoke it with bash so CI does not depend on file mode metadata.
      - name: Show toolchain versions
        working-directory: ./app
        run: |
          java -version
          bash ./gradlew --version

      - name: Validate Linux installer shell syntax
        run: bash -n app/app/src/main/assets/linux/install-miracle-klipper.sh

      - name: Run unit tests
        working-directory: ./app
        run: bash ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: ./app
        run: bash ./gradlew --no-daemon assembleDebug

      - name: Build release APK
        working-directory: ./app
        run: bash ./gradlew --no-daemon assembleRelease

      - name: Upload APKs and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miracle-klipper-ci-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            app/app/build/outputs/apk/**/*.apk
            app/app/build/reports/tests/**
            app/app/build/test-results/**

  release:
    name: Publish unsigned test APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download CI artifacts
        uses: actions/download-artifact@v4
        with:
          name: miracle-klipper-ci-${{ github.run_number }}
          path: release-artifacts

      - name: Prepare release asset
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find release-artifacts -type f -name '*release*.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo "Release APK not found in CI artifacts" >&2
            find release-artifacts -maxdepth 6 -type f -print
            exit 1
          fi
          cp "$apk" "Miracle-Klipper-${GITHUB_REF_NAME}-unsigned.apk"
          sha256sum "Miracle-Klipper-${GITHUB_REF_NAME}-unsigned.apk" > "Miracle-Klipper-${GITHUB_REF_NAME}-SHA256SUMS.txt"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Miracle-Klipper-${{ github.ref_name }}-unsigned.apk
            Miracle-Klipper-${{ github.ref_name }}-SHA256SUMS.txt
