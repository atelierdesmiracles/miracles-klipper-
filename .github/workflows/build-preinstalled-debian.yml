name: Build preinstalled Debian environments

on:
  push:
    branches:
      - miracle-klipper-next
    paths:
      - "app/app/src/main/assets/linux/install-miracle-klipper.sh"
      - ".github/workflows/build-preinstalled-debian.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rootfs:
    name: Debian 13 with Miracle Klipper (${{ matrix.arch }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
            url: https://github.com/termux/proot-distro/releases/download/v4.26.0/debian-trixie-aarch64-pd-v4.26.0.tar.xz
          - arch: x86_64
            runner: ubuntu-24.04
            url: https://github.com/termux/proot-distro/releases/download/v4.26.0/debian-trixie-x86_64-pd-v4.26.0.tar.xz
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends proot xz-utils curl ca-certificates
      - name: Download and unpack Debian Trixie
        env:
          ROOTFS_URL: ${{ matrix.url }}
        run: |
          set -euo pipefail
          mkdir -p work/rootfs
          curl --fail --location --retry 3 "$ROOTFS_URL" -o work/rootfs.tar.xz
          tar -xJf work/rootfs.tar.xz -C work/rootfs --strip-components=1 --exclude="dev/*" --exclude="./dev/*"
          test -x work/rootfs/usr/bin/apt-get
          mkdir -p work/rootfs/dev work/rootfs/proc work/rootfs/sys
      - name: Configure Debian repositories
        run: |
          set -euo pipefail
          mkdir -p work/rootfs/etc/apt/sources.list.d work/rootfs/etc/apt/apt.conf.d
          rm -f work/rootfs/etc/apt/sources.list
          cat > work/rootfs/etc/apt/sources.list.d/miracle-klipper.list <<'EOF'
          deb https://deb.debian.org/debian trixie main
          deb https://security.debian.org/debian-security trixie-security main
          EOF
          cat > work/rootfs/etc/apt/apt.conf.d/99-miracle-klipper <<'EOF'
          Acquire::Retries "3";
          Acquire::https::Timeout "45";
          Dpkg::Use-Pty "0";
          EOF
          mkdir -p work/rootfs/var/lib/miracle/printer_data/{config,logs,gcodes,comms}
          mkdir -p work/rootfs/var/lib/miracle/backups
          printf '#!/bin/sh\nexit 101\n' > work/rootfs/usr/sbin/policy-rc.d
          chmod +x work/rootfs/usr/sbin/policy-rc.d
      - name: Install Debian dependencies
        run: |
          set -euo pipefail
          # PRoot can segfault on GitHub-hosted ARM runners when tracing apt-get.
          # Use QEMU user emulation plus chroot on Linux runners instead of nested PRoot.
          sudo apt-get install -y --no-install-recommends qemu-user-static binfmt-support
          sudo mount --bind /dev work/rootfs/dev
          sudo mount --bind /proc work/rootfs/proc
          sudo mount --bind /sys work/rootfs/sys
          sudo chmod 1777 work/rootfs/tmp
          sudo cp /etc/resolv.conf work/rootfs/etc/resolv.conf
          sudo chroot work/rootfs /usr/bin/apt-get update
          sudo chroot work/rootfs /usr/bin/apt-get install -y --no-install-recommends \
            bash ca-certificates curl wget git nginx unzip python3 python3-venv python3-dev \
            python3-pip python3-setuptools python3-wheel build-essential gcc g++ make cmake pkg-config \
            libffi-dev libssl-dev libncurses-dev libncursesw6 zlib1g-dev libjpeg62-turbo libjpeg-dev \
            libtiff6 libtiff-dev libopenjp2-7 libopenjp2-7-dev libusb-1.0-0 libusb-1.0-0-dev \
            libudev-dev libyaml-dev liblzma-dev libbz2-dev libreadline-dev libsqlite3-dev libgdbm-dev \
            libnss3-dev util-linux usbutils xz-utils unzip procps iproute2 net-tools avrdude gcc-avr \
            binutils-avr avr-libc stm32flash gcc-arm-none-eabi binutils-arm-none-eabi \
            libnewlib-arm-none-eabi dfu-util flashrom
          sudo chroot work/rootfs /usr/bin/apt-get clean
          rm -rf work/rootfs/var/lib/apt/lists/*
          rm -f work/rootfs/usr/sbin/policy-rc.d
      - name: Install Klipper, Moonraker and Mainsail
        run: |
          set -euo pipefail
          mkdir -p work/rootfs/tmp
          cp app/app/src/main/assets/linux/install-miracle-klipper.sh work/rootfs/tmp/install-miracle-klipper.sh
          chmod +x work/rootfs/tmp/install-miracle-klipper.sh
          sudo chroot work/rootfs /bin/bash /tmp/install-miracle-klipper.sh
          sudo chroot work/rootfs /usr/bin/apt-get check
          test -x work/rootfs/opt/miracle-klipper/venvs/klipper/bin/python
          test -x work/rootfs/opt/miracle-klipper/venvs/moonraker/bin/python
          test -f work/rootfs/var/www/mainsail/index.html
          mkdir -p work/rootfs/var/lib/miracle
          printf 'schema=1\narch=${{ matrix.arch }}\ndebian=13\nstack=klipper-moonraker-mainsail\n' > work/rootfs/var/lib/miracle/preinstalled-environment
          rm -f work/rootfs/tmp/install-miracle-klipper.sh
          rm -rf work/rootfs/root/.cache work/rootfs/tmp/* work/rootfs/var/cache/apt/archives/*.deb
      - name: Package and checksum environment
        run: |
          set -euo pipefail
          tar --numeric-owner --xattrs --acls -cJf miracle-klipper-debian13-${{ matrix.arch }}-preinstalled.tar.xz -C work rootfs
          sha256sum miracle-klipper-debian13-${{ matrix.arch }}-preinstalled.tar.xz > miracle-klipper-debian13-${{ matrix.arch }}-preinstalled.tar.xz.sha256
          du -h miracle-klipper-debian13-${{ matrix.arch }}-preinstalled.tar.xz
          cat miracle-klipper-debian13-${{ matrix.arch }}-preinstalled.tar.xz.sha256
      - name: Upload preinstalled environment artifact
        uses: actions/upload-artifact@v4
        with:
          name: miracle-klipper-debian13-${{ matrix.arch }}-preinstalled
          path: |
            miracle-klipper-debian13-${{ matrix.arch }}-preinstalled.tar.xz
            miracle-klipper-debian13-${{ matrix.arch }}-preinstalled.tar.xz.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Publish preinstalled environment to the Debian release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="debian-trixie-${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}-preinstalled.tar.xz"
          cp "miracle-klipper-debian13-${{ matrix.arch }}-preinstalled.tar.xz" "$asset"
          sha256sum "$asset" > "$asset.sha256"
          gh release upload miracle-klipper-debian13 "$asset" "$asset.sha256" --clobber

  update-manifests:
    name: Pin preinstalled environment checksums
    needs: build-rootfs
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: miracle-klipper-next
          token: ${{ github.token }}
      - name: Download architecture artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: miracle-klipper-debian13-*-preinstalled
          merge-multiple: true
          path: dist
      - name: Update architecture manifests
        run: |
          set -euo pipefail
          cp dist/miracle-klipper-debian13-arm64-preinstalled.tar.xz dist/debian-trixie-aarch64-preinstalled.tar.xz
          cp dist/miracle-klipper-debian13-x86_64-preinstalled.tar.xz dist/debian-trixie-x86_64-preinstalled.tar.xz
          arm_hash="$(sha256sum dist/debian-trixie-aarch64-preinstalled.tar.xz | cut -d' ' -f1)"
          x86_hash="$(sha256sum dist/debian-trixie-x86_64-preinstalled.tar.xz | cut -d' ' -f1)"
          python3 - "$arm_hash" "$x86_hash" <<'PY'
          import json, pathlib, sys
          arm_hash, x86_hash = sys.argv[1:3]
          base = "https://github.com/atelierdesmiracles/miracles-klipper-/releases/download/miracle-klipper-debian13/"
          files = [
              ("app/app/src/main/assets/linux-environment.json", "debian-trixie-aarch64-preinstalled.tar.xz", arm_hash),
              ("app/app/src/main/assets/linux-environment-x86_64.json", "debian-trixie-x86_64-preinstalled.tar.xz", x86_hash),
          ]
          for name, asset, digest in files:
              path = pathlib.Path(name)
              data = json.loads(path.read_text())
              data["minimumFreeStorageBytes"] = 8589934592
              data["rootfs"]["url"] = base + asset
              data["rootfs"]["sha256"] = digest
              path.write_text(json.dumps(data, indent=2) + "\n")
          PY
      - name: Commit pinned manifests
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/app/src/main/assets/linux-environment.json app/app/src/main/assets/linux-environment-x86_64.json
          if git diff --cached --quiet; then
            echo "Manifests already match the built environments."
            exit 0
          fi
          git commit -m "Pin preinstalled Debian environment checksums"
          git push origin HEAD:miracle-klipper-next
