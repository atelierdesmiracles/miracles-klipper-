name: Build Miracle Klipper APK with Android-native PRoot

on:
  push:
    branches:
      - miracle-klipper-next
    paths:
      - "app/app/src/main/java/com/octo4a/repository/LinuxEnvironmentRepository.kt"
      - "app/app/build.gradle.kts"
      - ".github/workflows/build-native-proot-debug.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build universal debug APK with Android-native PRoot
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Download and package PRoot for supported Android ABIs
        run: |
          set -euo pipefail
          base="https://github.com/atelierdesmiracles/miracles-klipper-/releases/download/miracle-klipper-debian13"
          for item in "arm64:arm64-v8a" "x86_64:x86_64"; do
            arch="${item%%:*}"
            abi="${item#*:}"
            tmp="/tmp/proot-${arch}"
            mkdir -p "${tmp}" "app/app/src/main/jniLibs/${abi}"
            curl --fail --location --retry 3 "${base}/miracle-klipper-debian13-${arch}.zip" -o "/tmp/proot-${arch}.zip"
            unzip -q "/tmp/proot-${arch}.zip" -d "${tmp}"
            test -s "${tmp}/bin/proot"
            test -s "${tmp}/libexec/proot/loader"
            cp "${tmp}/bin/proot" "app/app/src/main/jniLibs/${abi}/libproot.so"
            cp "${tmp}/libexec/proot/loader" "app/app/src/main/jniLibs/${abi}/libproot-loader.so"
            chmod 755 "app/app/src/main/jniLibs/${abi}/libproot.so" "app/app/src/main/jniLibs/${abi}/libproot-loader.so"
            file "app/app/src/main/jniLibs/${abi}/libproot.so" "app/app/src/main/jniLibs/${abi}/libproot-loader.so"
          done

      - name: Build debug APK
        working-directory: app
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: miracle-klipper-debug
          path: app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
