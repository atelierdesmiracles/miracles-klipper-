name: Build Miracle Klipper APK with Android-native PRoot

on:
  push:
    branches:
      - miracle-klipper-next
    paths:
      - "app/app/src/main/java/com/octo4a/repository/LinuxEnvironmentRepository.kt"
      - "app/app/build.gradle.kts"
      - ".github/workflows/build-native-proot-debug.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK with packaged PRoot (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            abi: arm64-v8a
          - arch: x86_64
            abi: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Download and package PRoot in Android native library directory
        env:
          ARCH: ${{ matrix.arch }}
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          url="https://github.com/atelierdesmiracles/miracles-klipper-/releases/download/miracle-klipper-debian13/miracle-klipper-debian13-${ARCH}.zip"
          mkdir -p "/tmp/proot-${ARCH}" "app/app/src/main/jniLibs/${ABI}"
          curl --fail --location --retry 3 "${url}" -o "/tmp/proot-${ARCH}.zip"
          unzip -q "/tmp/proot-${ARCH}.zip" -d "/tmp/proot-${ARCH}"
          test -s "/tmp/proot-${ARCH}/bin/proot"
          test -s "/tmp/proot-${ARCH}/libexec/proot/loader"
          cp "/tmp/proot-${ARCH}/bin/proot" "app/app/src/main/jniLibs/${ABI}/libproot.so"
          cp "/tmp/proot-${ARCH}/libexec/proot/loader" "app/app/src/main/jniLibs/${ABI}/libproot-loader.so"
          chmod 755 "app/app/src/main/jniLibs/${ABI}/libproot.so" "app/app/src/main/jniLibs/${ABI}/libproot-loader.so"
          file "app/app/src/main/jniLibs/${ABI}/libproot.so" "app/app/src/main/jniLibs/${ABI}/libproot-loader.so"

      - name: Build debug APK
        working-directory: app
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: miracle-klipper-debug-${{ matrix.arch }}
          path: app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
