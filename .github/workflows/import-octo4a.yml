name: Import Octo4a Android sources

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Octo4a Git ref (branch, tag, or commit SHA)"
        required: true
        default: "master"
      target_branch:
        description: "Existing Miracle Klipper branch to update"
        required: true
        default: "feat/octo4a-to-miracle-klipper"
      confirm_import:
        description: "Type IMPORT to confirm adding upstream Android sources"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: octo4a-import-${{ github.event.inputs.target_branch }}
  cancel-in-progress: false

jobs:
  import:
    if: ${{ github.event.inputs.confirm_import == 'IMPORT' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}
          fetch-depth: 0

      - name: Guard against overwriting existing Android app
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e app ]]; then
            echo "::error::The app/ directory already exists. Refusing to overwrite it."
            exit 1
          fi

      - name: Fetch upstream Octo4a
        shell: bash
        env:
          UPSTREAM_REF: ${{ github.event.inputs.upstream_ref }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/feelfreelinux/octo4a.git /tmp/octo4a
          git -C /tmp/octo4a checkout --detach "$UPSTREAM_REF"
          test -d /tmp/octo4a/app
          cp -a /tmp/octo4a/app ./app
          cp /tmp/octo4a/LICENSE ./LICENSE-OCTO4A-AGPL-3.0.md
          cp /tmp/octo4a/README.md ./README-OCTO4A-UPSTREAM.md
          git -C /tmp/octo4a rev-parse HEAD > OCTO4A_UPSTREAM_COMMIT.txt
          printf '\nImported upstream: https://github.com/feelfreelinux/octo4a\nRef requested: %s\n' "$UPSTREAM_REF" >> OCTO4A_UPSTREAM_COMMIT.txt

      - name: Verify Gradle project files
        shell: bash
        run: |
          set -euo pipefail
          test -f ./gradlew
          test -d ./gradle
          test -d ./app
          test -f ./settings.gradle -o -f ./settings.gradle.kts

      - name: Commit imported sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app LICENSE-OCTO4A-AGPL-3.0.md README-OCTO4A-UPSTREAM.md OCTO4A_UPSTREAM_COMMIT.txt
          git commit -m "build: import Octo4a Android sources"
          git push origin HEAD:"${{ github.event.inputs.target_branch }}"

  reject-unconfirmed:
    if: ${{ github.event.inputs.confirm_import != 'IMPORT' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain confirmation requirement
        run: |
          echo "Import cancelled. Run this workflow again and type IMPORT to confirm."
          exit 1
