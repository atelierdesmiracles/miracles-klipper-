name: Miracle Klipper Android Build

on:
  workflow_dispatch:
  push:
    branches: [main, "feat/**"]
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "settings.gradle*"
      - "build.gradle*"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "settings.gradle*"
      - "build.gradle*"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check Android project exists
        id: project
        shell: bash
        run: |
          if [[ -f ./gradlew && -d ./gradle && -d ./app && ( -f ./settings.gradle || -f ./settings.gradle.kts ) ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Explain missing Android source import
        if: steps.project.outputs.present != 'true'
        run: |
          echo "::error::Android source tree is not imported yet. Run the 'Import Octo4a Android sources' workflow from the Actions tab, or use scripts/import-octo4a.sh locally."
          exit 1
      - uses: actions/setup-java@v4
        if: steps.project.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
      - name: Make Gradle wrapper executable
        if: steps.project.outputs.present == 'true'
        run: chmod +x ./gradlew
      - name: Install pinned Android PRoot runtime (ARM64)
        shell: bash
        run: |
          set -euo pipefail
          DEST="app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$DEST"
          BASE="https://github.com/coderredlab/proroot/releases/download/v1.2.8"
          declare -A SHA=(
            [libproroot.so]=a4e74d75b66cdc02b080adfe863dbf9951c3b30610d77beddc95488d5fe5de01
            [libproroot-runtime.so]=8c47a0a7db32d84c179ebb5bf3640f655a3181860ece5886ae44d92858730c34
            [libproroot-bridge.so]=1c5bc9537a270e8bf8b1c70222813f57b60b828bfb5503ddf8fe37685092de2f
            [libproroot-linker.so]=51a0ec5bfed00e572a0de09e22d9057e2befc386b78e426613d3e0ab03f4ecee
            [libproroot-stub-loader.so]=06c6624db3bdc45b9ced151cd781df439a37b47731d244b93e9d6a58cd48cde0
          )
          for name in "${!SHA[@]}"; do
            curl --fail --location --retry 3 "$BASE/$name" -o "$DEST/$name"
            echo "${SHA[$name]}  $DEST/$name" | sha256sum --check --status
          done
          chmod 755 "$DEST/libproroot.so"
      - name: Build debug APK
        if: steps.project.outputs.present == 'true'
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload debug APK
        if: steps.project.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: miracle-klipper-debug-apk
          path: app/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
