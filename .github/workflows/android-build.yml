name: Miracle Klipper Android Build

on:
  workflow_dispatch:
  push:
    branches: [main, "feat/**"]
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "settings.gradle*"
      - "build.gradle*"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "settings.gradle*"
      - "build.gradle*"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check Android project exists
        id: project
        shell: bash
        run: |
          if [[ -f ./gradlew && -d ./gradle && -d ./app && ( -f ./settings.gradle || -f ./settings.gradle.kts ) ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Explain missing Android source import
        if: steps.project.outputs.present != 'true'
        run: |
          echo "::error::Android source tree is not imported yet. Run the 'Import Octo4a Android sources' workflow from the Actions tab, or use scripts/import-octo4a.sh locally."
          exit 1
      - uses: actions/setup-java@v4
        if: steps.project.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
      - name: Make Gradle wrapper executable
        if: steps.project.outputs.present == 'true'
        run: chmod +x ./gradlew
      - name: Build debug APK
        if: steps.project.outputs.present == 'true'
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload debug APK
        if: steps.project.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: miracle-klipper-debug-apk
          path: app/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
